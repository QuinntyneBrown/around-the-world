<atw-screen [fill]="true" class="duel">
  <img class="duel__scene" src="img/scene-duel.jpg" alt="" />
  <div class="duel__scrim"></div>
  @if (duel(); as duel) {
    <header class="duel__hud">
      <atw-duel-hud
        [traveller]="traveller()"
        [deskHolder]="deskHolder()"
        [desk]="'Desk ' + duel.desk + ' of ' + duel.tourLength"
      >
        <atw-timer-bar
          [seconds]="duel.secondsToAnswer"
          [timeLeftMs]="duel.timeLeftMs"
          [kid]="duel.traveller.kid"
          [stopped]="!open()"
        />
      </atw-duel-hud>
      <atw-world-ring [tourLength]="duel.tourLength" [desk]="duel.desk" [places]="duel.ring" />
    </header>
    <div class="duel__progress">
      <p atw-pill>{{ duel.country }} · desk {{ duel.desk }} of {{ duel.tourLength }}</p>
    </div>
    <main id="main" class="duel__stage">
      <h1 class="visually-hidden">Duel at {{ duel.country }}</h1>
      <p class="visually-hidden" role="status" aria-live="assertive">{{ announcement() }}</p>
      <atw-flash-card
        [sum]="sum()"
        [sumLabel]="sumLabel()"
        [answer]="answerBox()"
        [frozen]="duel.frozen"
        [result]="line().result"
        [emphasis]="line().emphasis"
        [tone]="line().tone"
      />
      @if (open()) {
        <atw-number-pad [disabled]="duel.frozen" (keyPress)="press($event)" />
      }
    </main>
  } @else {
    <header class="duel__hud"><atw-duel-hud [loading]="true" /></header>
    <main id="main" class="duel__stage">
      <h1 class="visually-hidden">Duel</h1>
      <atw-flash-card status="Getting the first card ready…" result="Get ready…" />
    </main>
  }
  <footer class="duel__foot"></footer>
</atw-screen>
