@for (option of options(); track option.value) {
  <button
    type="button"
    class="toggle-chip"
    [attr.aria-pressed]="pressed().includes(option.value)"
    [disabled]="disabled()"
    (click)="toggled.emit(option.value)"
  >
    <atw-icon class="toggle-chip__tick" name="check" /><span
      class="toggle-chip__symbol"
      aria-hidden="true"
      >{{ option.symbol }}</span
    >
    {{ option.label }}
  </button>
}
