<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- a press on the backdrop is a pointer shortcut; Escape and Close do the same by keyboard -->
<div class="backdrop" (click)="closable() && closed.emit()"></div>
<div class="dialog">
  <div class="dialog__panel">
    <div class="dialog__header">
      <h2 class="dialog__title" [id]="titleId()">{{ heading() }}</h2>
      @if (closable()) {
        <button
          atw-icon-button
          type="button"
          icon="close"
          [attr.aria-label]="closeLabel()"
          (click)="closed.emit()"
        ></button>
      }
    </div>
    <div class="dialog__body"><ng-content /></div>
    <div class="dialog__footer"><ng-content select="[slot=actions]" /></div>
  </div>
</div>
