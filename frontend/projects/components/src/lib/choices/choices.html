@for (option of options(); track option.value) {
  <button
    type="button"
    class="choice"
    [attr.aria-pressed]="option.value === chosen()"
    [disabled]="disabled()"
    (click)="choose.emit(option.value)"
  >
    <span class="choice__value numeric">{{ option.label }}</span>&ngsp;<span class="choice__unit">{{
      option.unit
    }}</span>
  </button>
}
