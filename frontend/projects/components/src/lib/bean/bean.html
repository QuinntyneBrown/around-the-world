<svg
  class="bean-icon"
  [class.bean-icon--lg]="large()"
  viewBox="-26 -66 56 70"
  aria-hidden="true"
  focusable="false"
>
  <g [attr.data-kid]="kid()">
    <ellipse class="art-shadow" cx="0" cy="1" rx="17" ry="5" />
    @if (kid() === 'zuri') {
      <g transform="translate(-6 -44) rotate(-18)">
        <rect class="bean__pencil" x="-2.5" y="-20" width="5" height="18" rx="1" />
        <rect class="bean__eraser" x="-2.5" y="-24" width="5" height="5" rx="1.5" />
      </g>
    }
    <rect
      class="bean__deep"
      [class.bean__pack--kenji]="kid() === 'kenji'"
      x="-21"
      y="-36"
      width="10"
      height="22"
      rx="4.5"
    />
    <rect class="bean__deep" x="-11" y="-10" width="9" height="10" rx="4" />
    <rect class="bean__deep" x="3" y="-10" width="9" height="10" rx="4" />
    <rect class="bean__body" x="-14" y="-46" width="28" height="40" rx="14" />
    <path class="bean__smile" d="M-11 -14Q0 -8 11 -14" />
    <rect class="bean__visor" x="-3" y="-38" width="19" height="12" rx="6" />
    <rect class="bean__shine" x="3" y="-35.5" width="7" height="3" rx="1.5" />
    @switch (kid()) {
      @case ('zuri') {
        <g class="bean__hair">
          <circle cx="-9" cy="-45" r="5.5" />
          <circle cx="-1" cy="-48" r="6" />
          <circle cx="8" cy="-45" r="5.5" />
        </g>
      }
      @case ('kenji') {
        <g class="bean__line">
          <circle cx="2.5" cy="-32" r="4.5" />
          <circle cx="12.5" cy="-32" r="4.5" />
          <path d="M7 -32h1" />
        </g>
      }
      @case ('nia') {
        <rect class="bean__white" x="-14" y="-43" width="28" height="6" rx="3" />
        <rect class="bean__hair" x="-18" y="-41" width="6" height="12" rx="3" />
      }
      @case ('milo') {
        <path class="bean__metal" d="M-14 -40Q-14 -58 0 -58Q14 -58 14 -40Z" />
        <rect class="bean__metal-light" x="-15" y="-43" width="30" height="6" rx="3" />
        <g transform="translate(22 -2)">
          <rect class="bean__metal-light" x="-6" y="-13" width="12" height="10" rx="3" />
          <circle class="bean__eye" cx="-2" cy="-8" r="1.6" />
          <circle class="bean__eye" cx="2.5" cy="-8" r="1.6" />
          <rect class="bean__metal" x="-4" y="-3" width="8" height="4" rx="1.5" />
          <path class="bean__line" d="M0 -13v-4" />
        </g>
      }
      @case ('pip') {
        <g transform="translate(6 -62)">
          <path class="bean__white" d="M-12 2L14 -4L-4 8Z" />
          <path class="bean__line" d="M-4 8L0 2L14 -4" />
        </g>
      }
    }
  </g>
</svg>
