<span>
  <span class="setting__label" [id]="id">{{ label() }}</span>
  <span class="setting__help" [id]="id + '-help'">{{ help() }}</span>
</span>
<button
  type="button"
  class="switch"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-labelledby]="id"
  [attr.aria-describedby]="id + '-help'"
  [disabled]="disabled()"
  (click)="toggled.emit(!checked())"
>
  <span class="switch__state" aria-hidden="true">{{ checked() ? 'On' : 'Off' }}</span>
</button>
