@if (status(); as words) {
  <p class="visually-hidden" role="status">{{ words }}</p>
}
@if (sum(); as shown) {
  <p class="flash-card__sum">{{ shown }}</p>
} @else {
  <atw-skeleton shape="title" class="flash-card__sum flash-card__sum--dealing" />
}
<div class="flash-card__foot">
  @if (result(); as line) {
    <p
      class="flash-card__result"
      [class.flash-card__result--quiet]="tone() === 'quiet'"
      [class.flash-card__result--right]="tone() === 'right'"
      [class.flash-card__result--wrong]="tone() === 'wrong'"
    >
      {{ line }}
    </p>
  }
</div>
