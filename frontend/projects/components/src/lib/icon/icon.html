<svg
  class="icon"
  [class.icon--sm]="size() === 'sm'"
  [class.icon--lg]="size() === 'lg'"
  [class.icon--xl]="size() === 'xl'"
  aria-hidden="true"
  focusable="false"
  viewBox="0 0 24 24"
>
  @switch (name()) {
    @case ('back') {
      <path d="M19 12H5M12 19l-7-7 7-7" />
    }
    @case ('check') {
      <path d="M4 12l6 6L20 6" />
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 7v5l3 2" />
    }
    @case ('delete') {
      <path d="M21 5H9l-7 7 7 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM17 9l-6 6M11 9l6 6" />
    }
    @case ('dice') {
      <rect x="3" y="3" width="18" height="18" rx="4" />
      <path d="M8 8h.01M16 8h.01M12 12h.01M8 16h.01M16 16h.01" />
    }
    @case ('friends') {
      <circle cx="9" cy="8" r="4" />
      <path d="M2 21a7 7 0 0 1 14 0M16 4.3a4 4 0 0 1 0 7.4M22 21a7 7 0 0 0-4-6.3" />
    }
    @case ('frozen') {
      <path d="M12 2v20M4 6l16 12M20 6L4 18M9 3l3 3 3-3M9 21l3-3 3 3" />
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5M12 8h.01" />
    }
    @case ('retry') {
      <path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5" />
    }
    @case ('solo') {
      <circle cx="12" cy="8" r="4" />
      <path d="M4 21a8 8 0 0 1 16 0" />
    }
  }
</svg>
