@switch (shown()) {
  @case ('loading') {
    <atw-skeleton
      [shape]="size() === 'hero' ? 'panel' : 'block'"
      class="portrait"
      [class.portrait--sm]="size() === 'sm'"
      [class.portrait--md]="size() === 'md'"
      [class.portrait--fill]="size() === 'fill'"
      [class.portrait--hero]="size() === 'hero'"
      [class.portrait--round]="round()"
      [class.portrait--ring]="ring()"
    />
  }
  @case ('failed') {
    <span
      class="portrait"
      [class.portrait--sm]="size() === 'sm'"
      [class.portrait--md]="size() === 'md'"
      [class.portrait--fill]="size() === 'fill'"
      [class.portrait--hero]="size() === 'hero'"
      [class.portrait--round]="round()"
      [class.portrait--ring]="ring()"
      [attr.data-kid]="kid()"
      [attr.role]="alt() ? 'img' : null"
      [attr.aria-label]="alt() || null"
    >
      <atw-bean [kid]="kid()" [large]="size() === 'hero'" />
    </span>
  }
  @default {
    <img
      class="portrait"
      [class.portrait--sm]="size() === 'sm'"
      [class.portrait--md]="size() === 'md'"
      [class.portrait--fill]="size() === 'fill'"
      [class.portrait--hero]="size() === 'hero'"
      [class.portrait--round]="round()"
      [class.portrait--ring]="ring()"
      [attr.data-kid]="kid()"
      #picture
      [attr.srcset]="stageSrc() ? src() + ' 384w, ' + stageSrc() + ' 1024w' : null"
      [attr.sizes]="stageSrc() ? '(min-width: 62rem) 28rem, (min-width: 36rem) 24rem, 17rem' : null"
      (error)="picture.removeAttribute('srcset')"
      [src]="src()"
      [alt]="alt()"
      width="384"
      height="384"
    />
  }
}
