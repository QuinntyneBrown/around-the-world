@for (option of options(); track option.value) {
  <button
    type="button"
    class="segmented__option"
    [attr.aria-pressed]="option.value === chosen()"
    [disabled]="disabled()"
    (click)="choose.emit(option.value)"
  >
    <atw-icon class="segmented__tick" name="check" />{{ option.label }}
  </button>
}
