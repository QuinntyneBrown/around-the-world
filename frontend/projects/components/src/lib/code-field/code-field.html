<span class="visually-hidden">Room code</span>
<input
  #field
  class="code-field__input"
  type="text"
  inputmode="text"
  autocapitalize="characters"
  autocomplete="off"
  spellcheck="false"
  maxlength="4"
  [value]="value()"
  [disabled]="disabled()"
  [attr.aria-invalid]="invalid() || null"
  [attr.aria-describedby]="describedBy() || null"
  (input)="typed(field)"
  (keydown)="toEnd(field)"
  (keydown.enter)="enter()"
/>
@for (box of boxes(); track $index) {
  <span class="code-field__box" aria-hidden="true" [attr.data-active]="box.waiting || null">{{
    box.letter
  }}</span>
}
