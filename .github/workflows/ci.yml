# One pipeline, always green and under 5 minutes (AGENTS.md, CI; docs/adr/0007-ci-layout.md).
# It runs lint, format, the production build with its budgets, the backend's acceptance tests
# and the Playwright behaviour specs. Unit tests run locally (`node tools/verify/verify.mjs`),
# never here. It runs on every pull request, whatever its base, so stacked PRs are checked too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: End-to-end type check
        run: npm run e2e:typecheck
      - name: Production build with budgets
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Behaviour specs (the critical path of each feature, docs/adr/0015)
        run: npm run e2e -- --grep @critical

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Format
        run: dotnet format --verify-no-changes
      - name: Build
        run: dotnet build --configuration Release
      - name: Acceptance tests (the unit tests run locally, docs/adr/0031)
        run: dotnet test tests/AroundTheWorld.Api.Tests --configuration Release --no-build
