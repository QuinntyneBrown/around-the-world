</head>
<body>
<a class="skip-link" href="#main">Skip to the game</a>
<div class="screen">
<header class="topbar"><a class="icon-btn" href="../../pages/solo-or-friends/default.html" aria-label="Back"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a><h1 class="topbar__title">Set up your game</h1><div class="topbar__slot"></div></header>
<main id="main" class="screen__body screen__body--wide-first">
  <section class="panel" aria-labelledby="maths-title">
    <h2 class="panel__title" id="maths-title">Which maths?</h2>
    <div class="toggle-row" role="group" aria-label="Kinds of maths"><button type="button" class="toggle-chip" aria-pressed="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg><span class="toggle-chip__symbol" aria-hidden="true">×</span> Times</button><button type="button" class="toggle-chip" aria-pressed="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg><span class="toggle-chip__symbol" aria-hidden="true">+</span> Plus</button><button type="button" class="toggle-chip" aria-pressed="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg><span class="toggle-chip__symbol" aria-hidden="true">−</span> Minus</button><button type="button" class="toggle-chip" aria-pressed="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg><span class="toggle-chip__symbol" aria-hidden="true">÷</span> Divide</button></div>
    
    <div class="panel__head panel__head--spaced"><h3 class="panel__title panel__title--sm" id="tables-title">Times tables</h3><div class="cluster cluster--tight"><button type="button" class="text-btn">Easy</button><button type="button" class="text-btn">All</button></div></div>
    <div class="table-grid" role="group" aria-labelledby="tables-title"><button type="button" class="table-key" aria-pressed="true" aria-label="2 times table">×2</button><button type="button" class="table-key" aria-pressed="true" aria-label="3 times table">×3</button><button type="button" class="table-key" aria-pressed="true" aria-label="4 times table">×4</button><button type="button" class="table-key" aria-pressed="true" aria-label="5 times table">×5</button><button type="button" class="table-key" aria-pressed="true" aria-label="6 times table">×6</button><button type="button" class="table-key" aria-pressed="true" aria-label="7 times table">×7</button><button type="button" class="table-key" aria-pressed="true" aria-label="8 times table">×8</button><button type="button" class="table-key" aria-pressed="true" aria-label="9 times table">×9</button><button type="button" class="table-key" aria-pressed="true" aria-label="10 times table">×10</button><button type="button" class="table-key" aria-pressed="true" aria-label="11 times table">×11</button><button type="button" class="table-key" aria-pressed="true" aria-label="12 times table">×12</button></div>
    
  </section>
  <div class="stack stack--lg">
    <section class="panel" aria-labelledby="tour-title">
      <h2 class="panel__title" id="tour-title">How far round?</h2>
      <div class="choice-grid" role="group" aria-labelledby="tour-title"><button type="button" class="choice" aria-pressed="false"><span class="choice__value numeric">6</span><span class="choice__unit">desks</span></button><button type="button" class="choice" aria-pressed="false"><span class="choice__value numeric">12</span><span class="choice__unit">desks</span></button><button type="button" class="choice" aria-pressed="true"><span class="choice__value numeric">24</span><span class="choice__unit">desks</span></button></div>
      <p class="hint" aria-live="polite"><strong>Grand tour</strong> · about 10 minutes</p>
    </section>
    <section class="panel" aria-labelledby="speed-title">
      <h2 class="panel__title" id="speed-title">Card speed</h2>
      <div class="segmented" role="group" aria-labelledby="speed-title"><button type="button" class="segmented__option" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>Chill</button><button type="button" class="segmented__option" aria-pressed="false"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>Normal</button><button type="button" class="segmented__option" aria-pressed="true"><svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>Lightning</button></div>
      <p class="hint" aria-live="polite">3 seconds per card. Good luck!</p>
    </section>
    
    <a class="toy-btn toy-btn--xl toy-btn--block stack__end" href="../../pages/mic-check/default.html">Go!</a>
  </div>
</main>
</div>
